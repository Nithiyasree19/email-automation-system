<!DOCTYPE html>
<html>
<head>
    <title>Recipient Import</title>
</head>
<body>

<h2>Import Recipients</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <input
        type="file"
        name="recipient_file"
        accept=".csv,.xlsx"
        required
    >

    <br><br>

    <button type="submit">
        Import
    </button>

</form>

{% if message %}
    <hr>
    <h3>{{ message }}</h3>
{% endif %}

</body>
</html>
