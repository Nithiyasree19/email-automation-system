{% extends "base.html" %}

{% block title %}
Recipients
{% endblock %}

{% block content %}

<h1>Recipients</h1>

<table>

<tr>

<th>Name</th>
<th>Email</th>
<th>Action</th>

</tr>

{% for recipient in recipients %}

<tr>

<td>{{ recipient.name }}</td>

<td>{{ recipient.email }}</td>

<td>

<a
class="btn"
style="background:#dc2626;"
href="{% url 'delete_recipient' recipient.id %}"
>
Delete
</a>

</td>

</tr>

{% empty %}

<tr>

<td colspan="3">
No recipients found.
</td>

</tr>

{% endfor %}

</table>

{% endblock %}
