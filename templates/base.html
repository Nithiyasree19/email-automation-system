<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Email Automation System{% endblock %}</title>

    <style>

        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f6f9;
        }

        nav{

            background:#1f2937;
            padding:15px 30px;

        }

        nav a{

            color:white;
            text-decoration:none;
            margin-right:25px;
            font-weight:bold;

        }

        nav a:hover{

            color:#60a5fa;

        }

        .container{

            padding:30px;

        }

        table{

            width:100%;
            border-collapse:collapse;
            margin-top:20px;

        }

        th,td{

            border:1px solid #ddd;
            padding:10px;

        }

        th{

            background:#2563eb;
            color:white;

        }

        .card{

            background:white;
            border-radius:10px;
            padding:20px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);

        }

        .btn{

            background:#2563eb;
            color:white;
            padding:10px 18px;
            text-decoration:none;
            border-radius:5px;

        }

        .btn:hover{

            background:#1d4ed8;

        }

    </style>

</head>

<body>

<nav>

<a href="/">Dashboard</a>

<a href="/data/import/">Import</a>

<a href="/templates/">Templates</a>

<a href="/templates/send/">Send Email</a>

<a href="/schedule/">Schedule</a>

<a href="/logs/">Logs</a>

</nav>

<div class="container">

{% block content %}
{% endblock %}

</div>

</body>
</html>
